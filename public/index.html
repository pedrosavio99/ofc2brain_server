<!doctype html>
<html lang="pt-BR" data-tema="sistema">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="/estilos.css" />
<title>Segundo cérebro</title>

</head>
<body>

<header class="barra" id="barra">
  <div class="barra-int">
    <span class="barra-titulo">Segundo cérebro</span>
    <div class="barra-acoes">
      <button class="icone-btn" id="btnSinapse" aria-label="Ver sinapses" title="Ver sinapses">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="13" r="2.6"/>
          <circle cx="5" cy="18" r="2"/><circle cx="18.5" cy="17.5" r="2.2"/>
          <path d="M7.9 8.4l2.4 3M14.2 12.2l2.4-4.5M10.4 14.6L6.6 16.6M13.9 14.4l3 2.2" stroke-linecap="round" opacity=".65"/>
        </svg>
      </button>
      <button class="icone-btn" id="btnMenu" aria-label="Mais opções">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="envolucro">
  <h1 class="titulao">Segundo cérebro</h1>
  <p class="subtitulao" id="resumoTopo">Carregando…</p>

  <div class="busca" id="caixaBusca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="campoBusca" type="search" placeholder="Buscar por tema" autocomplete="off" />
    <button class="limpar" id="btnLimpar" aria-label="Limpar busca">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10" fill="currentColor" opacity=".28"/><path d="M15 9l-6 6M9 9l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <section class="compositor">
    <textarea id="campoNota" rows="2" placeholder="O que você quer guardar?"></textarea>
    <div class="compositor-rodape">
      <span class="dica-compositor">Resumo, área, tags e ligações são automáticos.</span>
      <button class="btn" id="btnAdicionar" disabled>Guardar</button>
    </div>
  </section>

  <nav class="segmentado" id="abas">
    <div class="indicador" id="indicadorAba"></div>
    <button class="ativo" data-aba="foco">Em foco</button>
    <button data-aba="areas">Áreas</button>
    <button data-aba="tempo">Linha do tempo</button>
    <button data-aba="eventos">Eventos</button>
  </nav>

  <div id="filtros"></div>
  <div id="conteudo"></div>
</main>

<div class="cortina" id="cortina"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="puxador"></div>
  <div class="sheet-cab">
    <h3 id="sheetTitulo">Título</h3>
    <button class="icone-btn" id="btnFechaSheet" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-corpo" id="sheetCorpo"></div>
</div>

<!-- Visao Sinaptica -->
<div class="sinapse" id="sinapse" role="dialog" aria-modal="true" aria-label="Visão sináptica">
  <canvas id="telaSinapse"></canvas>
  <div class="sinapse-topo">
    <div>
      <h2>Visão sináptica</h2>
      <p id="sinapseSub">—</p>
    </div>
    <button class="icone-btn" id="btnFechaSinapse" aria-label="Fechar visão sináptica">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sinapse-controles" id="sinapseControles"></div>
  <div class="sinapse-zoom" id="sinapseZoom">
    <button id="btnZoomMais" aria-label="Aproximar" title="Aproximar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
    </button>
    <button id="btnZoomMenos" aria-label="Afastar" title="Afastar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12"/></svg>
    </button>
    <button id="btnEnquadrar" aria-label="Ver tudo" title="Ver tudo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg>
    </button>
  </div>
  <div class="legenda" id="legendaAreas"></div>
  <div class="sinapse-dica" id="sinapseDica">um dedo gira · pince para aproximar · dois dedos movem · toque num neurônio</div>
  <div class="sinapse-carregando oculto" id="sinapseCarregando">calibrando sinapses…</div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="arquivoBackup" accept=".bin,application/octet-stream" class="oculto" />

<!-- app.js primeiro: define $, esc, o estado e as telas.
     sinapse.js depois: usa o que o app.js expoe. -->
<script src="/app.js"></script>
<script src="/insight.js"></script>
<script src="/garimpo.js"></script>
<script src="/sinapse.js"></script>
<!-- Modulos externos: cada um injeta a propria aba em #abas. -->
<script src="/trabalho/aba-trabalho.js"></script>
</body>
</html>
