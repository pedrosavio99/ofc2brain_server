<!doctype html>
<html lang="pt-BR" data-tema="sistema">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<!-- O modulo reaproveita os tokens e componentes do Segundo Cerebro.
     trabalho.css so acrescenta o que e especifico daqui. -->
<link rel="stylesheet" href="/estilos.css" />
<link rel="stylesheet" href="/trabalho/trabalho.css" />
<title>Trabalho</title>
<link rel="icon" type="image/svg+xml" href="/cerebro-mini.svg" />
<script>
  // Antes da primeira pintura, senao o tema escuro pisca branco.
  try { document.documentElement.dataset.tema = localStorage.getItem("2brain-tema") || "sistema"; } catch (e) {}
</script>
</head>
<body>

<header class="barra" id="barra">
  <div class="barra-int">
    <a class="voltar voltar-barra" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      Segundo cérebro
    </a>
    <span class="barra-titulo">Trabalho</span>
    <div class="barra-acoes">
      <button class="icone-btn" id="btnAtualizar" aria-label="Atualizar" title="Atualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8 8 0 10-2.3 6"/><path d="M20 5v6h-6"/>
        </svg>
      </button>
      <button class="icone-btn" id="btnOpcoes" aria-label="Opções">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="envolucro">
  <h1 class="titulao">Trabalho</h1>
  <p class="subtitulao" id="resumoTopo">Carregando…</p>

  <div class="busca" id="caixaBusca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="campoBusca" type="search" placeholder="Filtrar por título, lista, tag ou id" autocomplete="off" />
    <button class="limpar" id="btnLimpar" aria-label="Limpar busca">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10" fill="currentColor" opacity=".28"/><path d="M15 9l-6 6M9 9l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <nav class="segmentado" id="abasGrupo">
    <div class="indicador" id="indicadorGrupo"></div>
    <button class="ativo" data-grupo="prazo">Prazo</button>
    <button data-grupo="status">Status</button>
    <button data-grupo="space">Espaço</button>
    <button data-grupo="list">Lista</button>
  </nav>

  <div id="filtros"></div>
  <div id="conteudo"></div>
</main>

<!-- Barra flutuante da selecao, some quando nao ha nada marcado -->
<div class="tr-barra-plano" id="barraPlano" hidden>
  <span class="tr-contagem" id="contagemSel">0 selecionadas</span>
  <button class="btn" id="btnPlano">Ordem de execução</button>
  <button class="btn btn-suave" id="btnLimparSel">Limpar</button>
</div>

<div class="cortina" id="cortina"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="puxador"></div>
  <div class="sheet-cab">
    <h3 id="sheetTitulo">Título</h3>
    <button class="icone-btn" id="btnFechaSheet" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-corpo" id="sheetCorpo"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/pin.js"></script>
<script src="/trabalho/trabalho.js"></script>
</body>
</html>
