<!doctype html>
<html lang="pt-BR" data-tema="sistema">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>TrendRadar</title>
    <link rel="icon" type="image/svg+xml" href="/cerebro-mini.svg" />
    <link rel="stylesheet" href="/estilos.css" />
    <link rel="stylesheet" href="/trendradar/radar.css" />
    <script>
      try {
        document.documentElement.dataset.tema =
          localStorage.getItem("2brain-tema") ||
          localStorage.getItem("tema_preferido") ||
          "sistema";
      } catch (e) {}
      try {
        var _tr = sessionStorage.getItem("2brain-nav-transicao");
        if (_tr) {
          var _ti = JSON.parse(_tr);
          if (_ti && Date.now() - _ti.ts < 2500) document.documentElement.classList.add("nav-transicao");
        }
      } catch (e) {}
    </script>
  </head>
  <body data-modulo="trendradar">
    <header class="barra" id="barra">
      <div class="barra-int">
        <div class="barra-marca-bloco">
          <a class="barra-marca" href="/" title="Ir para início do Segundo cérebro" aria-label="Segundo cérebro">
            <img src="/cerebro-mini.svg" alt="" width="28" height="28" draggable="false" />
          </a>
          <span class="barra-separador-modulo" aria-hidden="true">/</span>
          <span class="barra-modulo-atual" id="subtituloCabecalho">TrendRadar</span>
        </div>
        <div class="barra-acoes">
          <button
            class="icone-btn"
            id="btnPesquisarTopo"
            type="button"
            data-acao="abrir-investigar"
            aria-label="Pesquisar alvo no radar"
            title="Pesquisar assunto, empresa ou dor"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
              <path d="M11 8v6M8 11h6" />
            </svg>
          </button>
          <button
            class="icone-btn"
            id="btnAtualizar"
            type="button"
            data-acao="atualizar-radar"
            aria-label="Atualizar radar"
            title="Atualizar dados do radar"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11a8 8 0 10-2.3 6" />
              <path d="M20 5v6h-6" />
            </svg>
          </button>
          <button
            class="icone-btn"
            id="btnOpcoes"
            type="button"
            data-acao="abrir-menu"
            aria-label="Opções e ferramentas do TrendRadar"
            title="Opções e ferramentas do TrendRadar"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" />
            </svg>
          </button>
          <button
            class="icone-btn btn-menu-eco"
            id="btnMenuEco"
            type="button"
            aria-label="Menu do ecossistema"
            title="Menu do ecossistema"
          >
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="5" cy="12" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="19" cy="12" r="2" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="envolucro tr-envolucro" id="app">
      <h1 class="titulao">TrendRadar</h1>
      <p class="subtitulao" id="resumoTopo">Lendo o que a imprensa publicou…</p>

      <!-- Estado da coleta e avisos (banco sem tabelas, coleta em andamento, erro) -->
      <div id="trAviso" aria-live="polite"></div>

      <!-- Resumo do dia: cada bloco tambem filtra a lista -->
      <section id="trResumo" class="tr-resumo" aria-label="Resumo do radar"></section>

      <div class="busca" id="caixaBusca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
        <input id="campoBusca" type="search" placeholder="Buscar assunto, dor ou manchete…" autocomplete="off" spellcheck="false" />
        <button class="limpar" id="limparBusca" type="button" data-acao="limpar-busca" aria-label="Limpar busca">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <circle cx="12" cy="12" r="10" fill="currentColor" opacity=".28" />
            <path d="M15 9l-6 6M9 9l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
          </svg>
        </button>
      </div>

      <nav class="segmentado" id="trOrdem" role="tablist" aria-label="Ordenar o radar">
        <div class="indicador" id="trIndicador"></div>
        <button type="button" role="tab" data-acao="ordem" data-ordem="recentes" class="ativo">Mais novos</button>
        <button type="button" role="tab" data-acao="ordem" data-ordem="alta">Em alta</button>
        <button type="button" role="tab" data-acao="ordem" data-ordem="combina">Pra você</button>
      </nav>

      <div id="trFiltros" role="toolbar" aria-label="Filtrar por frente"></div>

      <div id="trLista" class="tr-lista" aria-live="polite"></div>
      <p id="trRodape" class="tr-rodape"></p>
    </main>

    <div class="cortina" id="cortina" data-acao="fechar-sheet"></div>
    <div class="sheet tr-sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="puxador"></div>
      <div class="sheet-cab">
        <h3 id="sheetTitulo">Opções</h3>
        <button class="icone-btn" id="fecharSheet" type="button" data-acao="fechar-sheet" aria-label="Fechar painel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-corpo" id="sheetCorpo"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/pin.js"></script>
    <script src="/navegacao.js"></script>
    <script src="/trendradar/radar.js"></script>
  </body>
</html>
